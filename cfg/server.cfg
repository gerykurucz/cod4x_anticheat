loadplugin nektumshield


/* *************** Change the dvars how you prefer *************** */

// Ban threshold - number of cheat points required to ban a player (default: 30, range: 10 - 100)
set ac_score_ban "30" // Not recommended to change this to lower value!

// Minimum kills required before headshot ratio check activates (default: 40, range: 5 - 200)
set ac_min_kills "40"

// Consecutive hits on the same body location to flag body lock (default: 15, range: 3 - 20)
set ac_body_lock_streak "15"

// Number of perfect center shots in a row to flag aimbot (default: 7, range: 3 - 15)
set ac_perfect_shots "7"

// Long-range hipfire kills needed to trigger detection (default: 10, range: 3 - 20)
set ac_hipfire_kills "10"

// Minimum number of recoil samples required before no-recoil check (default: 7, range: 5 - 30)
set ac_recoil_samples "7"

// Delay in milliseconds between ban detection and actual kick (default: 5000, range: 1000 - 30000)
set ac_drop_delay_ms "5000"

// Delay in seconds before checking for name theft (default: 3, range: 1 - 10)
set ac_name_check_delay "3"

// Maximum headshot ratio before triggering (default: 0.8, range: 0.1 - 1.0)
set ac_hs_ratio "0.8"

// Snap aimbot detection: minimum sudden view angle change in degrees (default: 175.0, range: 50.0 - 180.0)
set ac_snap_threshold "175.0"

// Silent aim angle threshold in degrees (default: 3.5, range: 1.0 - 45.0)
set ac_silent_aim_angle "3.5"

// Silent aim minimum distance to consider (default: 500.0, range: 400.0 - 2000.0)
set ac_silent_aim_dist "500.0"

// Perfect shot yaw/pitch deviation allowed in degrees (default: 2.5, range: 1.0 - 10.0)
set ac_perfect_yaw_pitch "2.5"

// Hipfire detection distance threshold (default: 4000.0, range: 1000.0 - 8000.0)
set ac_hipfire_dist "4000.0"

// No-recoil threshold: correlation must be above this to flag (default: 0.998, range: 0.99 - 1.0)
set ac_norecoil_threshold "0.998"

// Variance allowed for no-recoil macro detection (default: 0.1, range: 0.05 - 1.0)
set ac_recoil_macro_var "0.1"

// Mean pitch value for no-recoil macro detection (default: -0.5, range: -5.0 - 0.0)
set ac_recoil_macro_mean "-0.5"

// Distance player moves after alt-tab to consider them back (default: 300.0, range: 150.0 - 400.0)
set ac_alttab_move_dist "300.0"

// Time in seconds player must move after alt-tab (default: 25.0, range: 10.0 - 40.0)
set ac_alttab_move_time "25.0"

// Consecutive headshots within a time window to flag (default: 6, range: 3 - 20)
set ac_time_hs_streak "6"

// Time window in seconds for headshot streak detection (default: 10.0, range: 2.0 - 30.0)
set ac_time_hs_window "10.0"

// Consecutive body location hits within a time window to flag (default: 10, range: 3 - 20)
set ac_time_bl_streak "10"

// Time window in seconds for body location streak detection (default: 10.0, range: 2.0 - 30.0)
set ac_time_bl_window "10.0"

// Snap angle to track for a follow-up kill (default: 70.0, range: 20.0 - 150.0)
set ac_snap_kill_angle "70.0"

// Time window in seconds for snap + kill combo detection (default: 1.0, range: 0.5 - 5.0)
set ac_snap_kill_window "1.0"

// Minimum distance for moving headshot detection (default: 1500.0, range: 500.0 - 5000.0)
set ac_moving_hs_dist "1500.0"

// Consecutive moving headshots to flag (default: 5, range: 3 - 15)
set ac_moving_hs_streak "5"

// Time window in seconds for moving headshot streak (default: 15.0, range: 5.0 - 30.0)
set ac_moving_hs_window "15.0"

// Macro logic: number of clicks within window to trigger suspicion (default: 5, range: 3 - 20)
set ac_macro_logic_clicks "5"

// Macro logic: time window in milliseconds (default: 300, range: 100 - 1000)
set ac_macro_logic_window "300"

// Macro logic: strikes before adding ban score (default: 3.0, range: 1.0 - 15.0)
set ac_macro_logic_strikes "3.0"

// Scroll macro: consecutive fast clicks to trigger (default: 4, range: 2 - 15)
set ac_macro_scroll_count "4"

// Scroll macro: fast click threshold in ms (default: 60, range: 30 - 200)
set ac_macro_scroll_fast "60"

// Scroll macro: reset threshold in ms (default: 120, range: 100 - 300)
set ac_macro_scroll_reset "120"

// Rate macro: consecutive fast clicks to trigger (default: 7, range: 3 - 20)
set ac_macro_rate_count "7"

// Rate macro: fast click threshold in ms (default: 85, range: 50 - 200)
set ac_macro_rate_fast "85"

// Consistency macro: number of matching gaps to trigger (default: 5, range: 3 - 20)
set ac_macro_consistency_count "5"

// Consistency macro: max gap in ms to consider (default: 120, range: 50 - 300)
set ac_macro_consistency_gap "120"

// Silent aim hipfire max dot product (lower = stricter) (default: 0.30, range: 0.10 - 0.99)
set ac_silent_aim_threshold_hipfire "0.30"

// Silent aim ADS max dot product (lower = stricter) (default: 0.80, range: 0.50 - 0.99)
set ac_silent_aim_threshold_ads "0.80"

// Silent aim: impossible hits streak to trigger ban (default: 4, range: 2 - 10)
set ac_silent_aim_streak "4"

// No-recoil: ADS zero-move frames to trigger (50fps basis) (default: 500, range: 50 - 500)
set ac_ads_norecoil_frames "500"

// No-spread: max deviation between consecutive hits (default: 50.0, range: 10.0 - 50.0)
set ac_nospread_max_deviation "50.0"

// No-spread: consecutive hits to trigger (default: 4, range: 3 - 8)
set ac_nospread_streak "4"

// Target switch: max time between two kills in seconds (default: 0.12, range: 0.10 - 0.40)
set ac_target_switch_time "0.12"

// Target switch: min camera turn angle between victims (default: 90.0, range: 30.0 - 120.0)
set ac_target_switch_angle "90.0"

// Target switch: consecutive impossible switches to flag (default: 3, range: 2 - 5)
set ac_target_switch_streak "3"

// ESP suspect score threshold before warning (default: 10, range: 10 - 500)
set ac_esp_warn_threshold "10"

// ESP minimum distance to consider (default: 100.0, range: 50.0 - 4000.0)
set ac_esp_min_dist "100.0"

// ESP maximum distance to consider (default: 40000.0, range: 2000.0 - 45000.0)
set ac_esp_max_dist "40000.0"

// Seconds before enemy is considered occluded (default: 0.8, range: 0.1 - 10.0)
set ac_esp_occlusion_time "0.8"

// Minimum distance for occlusion check (default: 1500.0, range: 50.0 - 2000.0)
set ac_esp_occlusion_dist "1500.0"

// Distance to consider enemy as seen (default: 15000.0, range: 5000.0 - 40000.0)
set ac_esp_seen_dist "15000.0"

// ESP score decay per second (default: 0.01, range: 0 - 1)
set ac_esp_score_decay "0.01"